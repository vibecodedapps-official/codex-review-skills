name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check script syntax
        shell: bash
        run: |
          shopt -s nullglob
          for f in tests/*.sh tests/fixtures/*.sh; do
            bash -n "$f"
          done
      - name: Validate JSON files
        shell: bash
        run: |
          for f in plugins/codex-review-skills/.codex-plugin/plugin.json .agents/plugins/marketplace.json evals/evals.json; do
            python3 -m json.tool "$f" > /dev/null
          done
      - name: Check the changelog version
        shell: bash
        run: |
          tests/version.sh --self-test
          tests/version.sh
      - name: Self-test the checks
        shell: bash
        run: tests/run-self-tests.sh
